[build]
  command = "node scripts/check-branding.mjs && node scripts/reality-audit.mjs && cd app && npm ci && npm run build"
  publish = "app/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  VITE_SOLANA_NETWORK = "testnet"
  VITE_SOLANA_RPC_URL = "https://api.testnet.solana.com"

[functions]
  included_files = ["backend/testnet-deployment.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
