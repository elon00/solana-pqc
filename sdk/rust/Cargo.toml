[package]
name = "scstobcminority-ai-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
license = "MIT"
description = "Rust SDK for SCSTOBCMinority AI quantum-safe Solana custody"
repository = "https://github.com/elon00/scstobcminority-ai"
keywords = ["solana", "post-quantum", "cryptography", "nist"]

[dependencies]
anchor-lang = "=0.29.0"
solana-sdk = "=1.17.0"
solana-program = "=1.17.0"
borsh = "=0.10.3"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pqcrypto-kyber = "0.8"
pqcrypto-dilithium = "0.5"
pqcrypto-sphincsplus = "0.7"
pqcrypto-traits = "0.3.5"
sha3 = "0.10"
blake3 = "=1.5.0"
rand = "0.8"
zeroize = "=1.3.0"
zeroize_derive = "=1.4.2"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }

[workspace]
