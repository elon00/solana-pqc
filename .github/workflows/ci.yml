name: Solana-PQC CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: 18

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: cd app && npm ci
      - run: cd app && npm run build

  rust:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Rust workspace when present
        run: |
          if find . -name Cargo.toml -not -path './node_modules/*' | grep -q .; then
            cargo check --workspace || cargo check
            cargo test --workspace || cargo test
            cargo fmt --all -- --check
          else
            echo "No Rust workspace detected"
          fi

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [frontend, rust]
    steps:
      - run: echo "Solana-PQC build and Rust checks passed."

# Deployments are intentionally separate from CI.
# Configure Vercel/Solana/Docker/Railway workflows explicitly with required secrets.
