name: SCSTOBCMinority AI CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: 20

jobs:
  branding:
    name: Canonical Branding Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-branding.mjs

  reality:
    name: Reality Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate evidence scorecard
        run: node scripts/reality-audit.mjs

  serverless:
    name: Serverless Adapter Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --check netlify/functions/api.mjs
      - run: node --check api/index.mjs

  backend:
    name: Backend Testnet Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run check
        working-directory: backend
      - run: npm test
        working-directory: backend
      - name: Boot backend and verify Testnet health
        working-directory: backend
        env:
          SOLANA_RPC_URL: https://api.testnet.solana.com
          API_PORT: 3001
        run: |
          npm start > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3001/health; then
              kill "$(cat /tmp/backend.pid)" || true
              exit 0
            fi
            sleep 2
          done
          cat /tmp/backend.log
          kill "$(cat /tmp/backend.pid)" || true
          exit 1

  frontend:
    name: Frontend Testnet Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Build Testnet frontend
        working-directory: app
        env:
          VITE_SOLANA_NETWORK: testnet
          VITE_SOLANA_RPC_URL: https://api.testnet.solana.com
          VITE_API_BASE_URL: ${{ vars.TESTNET_BACKEND_URL }}
        run: npm run build

  rust:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Rust workspace
        run: |
          cargo check --workspace
          cargo test --workspace
          cargo fmt --all -- --check || echo "::warning::Rust formatting differs from rustfmt output."

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [branding, reality, serverless, backend, frontend, rust]
    steps:
      - run: echo "Branding, reality, serverless, backend, frontend and Rust gates completed for the Testnet-first stack."
