name: Deploy SCSTOBCMinority AI to Solana Devnet

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "programs/**"
      - "scripts/initialize-devnet.mjs"
      - "Anchor.toml"
      - ".github/workflows/deploy-devnet.yml"
      - "DEVNET_DEPLOYMENT.md"

permissions:
  contents: read

concurrency:
  group: scstobcminority-ai-devnet
  cancel-in-progress: false

env:
  PROJECT_AUTHORITY: 8QrEi46qwx1hxZBa9RGvxh4FrAK2rsG6BmRT1xV9qMWg
  ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
  SOLANA_URL: https://api.devnet.solana.com

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-devnet]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libudev-dev libssl-dev

      - name: Install AVM and pinned Anchor/Solana toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/otter-sec/anchor/master/avm/install | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          avm install 0.29.0
          avm use 0.29.0
          avm solana install 1.18.18 --force
          anchor --version
          solana --version

      - name: Create ephemeral devnet payer
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force --outfile "$HOME/.config/solana/id.json"
          solana config set --url "$SOLANA_URL"
          solana config set --keypair "$HOME/.config/solana/id.json"
          echo "ANCHOR_WALLET=$HOME/.config/solana/id.json" >> "$GITHUB_ENV"
          echo "Ephemeral payer: $(solana address)"

      - name: Fund ephemeral payer on devnet
        run: |
          for i in 1 2 3 4 5 6; do
            solana airdrop 2 "$HOME/.config/solana/id.json" --url "$SOLANA_URL" || true
            sleep 3
          done
          solana balance --url "$SOLANA_URL"

      - name: Build and synchronize program IDs
        run: |
          anchor build
          anchor keys sync
          anchor build
          echo "QUANTUM_CUSTODY_PROGRAM_ID=$(solana address -k target/deploy/quantum_custody-keypair.json)" >> "$GITHUB_ENV"
          echo "SPQC_TOKEN_PROGRAM_ID=$(solana address -k target/deploy/solana_pqc_token-keypair.json)" >> "$GITHUB_ENV"

      - name: Deploy programs to devnet
        run: |
          anchor deploy --provider.cluster devnet
          solana program show "$QUANTUM_CUSTODY_PROGRAM_ID" --url "$SOLANA_URL"
          solana program show "$SPQC_TOKEN_PROGRAM_ID" --url "$SOLANA_URL"

      - name: Install initialization client
        run: npm install --no-save --ignore-scripts @coral-xyz/anchor@0.29.0

      - name: Initialize custody and uncapped SPQC mint
        run: |
          node scripts/initialize-devnet.mjs | tee /tmp/devnet-init.txt
          grep -E '^[A-Z_]+=[A-Za-z0-9]+$' /tmp/devnet-init.txt >> "$GITHUB_ENV"

      - name: Transfer upgrade authority to project owner
        run: |
          solana program set-upgrade-authority "$QUANTUM_CUSTODY_PROGRAM_ID" --new-upgrade-authority "$PROJECT_AUTHORITY" --skip-new-upgrade-authority-signer-check --url "$SOLANA_URL"
          solana program set-upgrade-authority "$SPQC_TOKEN_PROGRAM_ID" --new-upgrade-authority "$PROJECT_AUTHORITY" --skip-new-upgrade-authority-signer-check --url "$SOLANA_URL"

      - name: Verify final on-chain state
        run: |
          solana program show "$QUANTUM_CUSTODY_PROGRAM_ID" --url "$SOLANA_URL"
          solana program show "$SPQC_TOKEN_PROGRAM_ID" --url "$SOLANA_URL"
          solana account "$SPQC_MINT" --url "$SOLANA_URL"

      - name: Publish deployment summary
        if: success()
        run: |
          {
            echo "## SCSTOBCMinority AI - Solana Devnet Deployment"
            echo
            echo "- Network: devnet"
            echo "- Project authority: $PROJECT_AUTHORITY"
            echo "- Quantum Custody Program: $QUANTUM_CUSTODY_PROGRAM_ID"
            echo "- SPQC Token Program: $SPQC_TOKEN_PROGRAM_ID"
            echo "- SPQC Mint: $SPQC_MINT"
            echo "- Token Info PDA: $SPQC_TOKEN_INFO"
            echo "- Custody Global State PDA: $QUANTUM_CUSTODY_GLOBAL_STATE"
            echo "- Custody initialization signature: $CUSTODY_INITIALIZE_SIGNATURE"
            echo "- Token initialization signature: $TOKEN_INITIALIZE_SIGNATURE"
            echo
            echo "Supply policy: uncapped at the application layer; SPL Token u64 raw supply remains the protocol ceiling."
          } >> "$GITHUB_STEP_SUMMARY"
