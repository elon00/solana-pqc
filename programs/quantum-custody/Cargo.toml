[package]
name = "quantum-custody"
version = "0.1.0"
description = "Quantum-safe custody program for Solana"
edition = "2021"
rust-version = "1.68"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "quantum_custody"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { workspace = true }
borsh = { workspace = true }
thiserror = { workspace = true }
sha3 = { workspace = true }

# Resolver constraints: keep Anchor 0.29/Solana 1.17 build reproducible.
solana-program = { workspace = true }
blake3 = { workspace = true }
